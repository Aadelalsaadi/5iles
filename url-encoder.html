<nav>

    <a href="/">Tools</a>

<div class="hero">
  <div class="tool-icon">🔗</div>
  <h1>URL <span>Encoder/Decoder</span></h1>
  <p class="subtitle">Encode or decode URLs and query strings instantly.</p>
</div>

<div class="tool-container">
  <div class="mode-tabs">
    <div class="mode-tab active" onclick="setMode('encode', this)">Encode</div>
    <div class="mode-tab" onclick="setMode('decode', this)">Decode</div>
  </div>

  <textarea id="inputText" placeholder="Paste your URL or text here..."></textarea>

  <button class="action-btn" id="actionBtn" onclick="process()">🔗 Encode URL</button>

  <div class="result-box" id="resultBox">
    <div class="result-label">
      <span id="resultLabel">Result</span>
      <button class="copy-btn" onclick="copyResult()">📋 Copy</button>
    </div>
    <div class="result-text" id="resultText"></div>
  </div>

  <div class="features">
    <div class="feature">
      <div class="feature-icon">🔗</div>
      <div class="feature-title">Encode & Decode</div>
      <div class="feature-desc">Full URL component encoding</div>
    </div>
    <div class="feature">
      <div class="feature-icon">⚡</div>
      <div class="feature-title">Instant</div>
      <div class="feature-desc">Real-time conversion</div>
    </div>
    <div class="feature">
      <div class="feature-icon">🔒</div>
      <div class="feature-title">Private</div>
      <div class="feature-desc">Runs entirely in your browser</div>
    </div>
  </div>
</div>

<footer>
  <a href="/">← Back to all tools</a> · © 2025 5iles.com
</footer>

<script>
let currentMode = 'encode';

const inputText = document.getElementById('inputText');
const actionBtn = document.getElementById('actionBtn');
const resultBox = document.getElementById('resultBox');
const resultLabel = document.getElementById('resultLabel');
const resultText = document.getElementById('resultText');

function setMode(mode, el) {
  currentMode = mode;
  document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  actionBtn.textContent = mode === 'encode' ? '🔗 Encode URL' : '🔓 Decode URL';
  resultBox.classList.remove('show');
}

function process() {
  const text = inputText.value;
  if (!text.trim()) return;

  try {
    let result;
    if (currentMode === 'encode') {
      result = encodeURIComponent(text);
      resultLabel.textContent = 'Encoded URL';
    } else {
      result = decodeURIComponent(text);
      resultLabel.textContent = 'Decoded URL';
    }
    resultText.textContent = result;
    resultText.classList.remove('error');
    resultBox.classList.add('show');
  } catch (err) {
    resultText.textContent = 'Error: ' + err.message + '\n\nMake sure the input is a valid encoded string.';
    resultText.classList.add('error');
    resultBox.classList.add('show');
  }
}

function copyResult() {
  const text = resultText.textContent;
  if (!text) return;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.copy-btn');
    const original = btn.textContent;
    btn.textContent = '✓ Copied!';
    setTimeout(() => { btn.textContent = original; }, 1500);
  });
}

inputText.addEventListener('input', process);
</script>
