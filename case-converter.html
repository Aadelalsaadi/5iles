<div class="tool-container">
  <textarea id="inputText" placeholder="Type or paste your text here..."></textarea>
  <div class="stats" id="inputStats"></div>

  <div class="case-grid">
    <button class="case-btn" onclick="convert('upper')">UPPERCASE<span class="example">HELLO WORLD</span></button>
    <button class="case-btn" onclick="convert('lower')">lowercase<span class="example">hello world</span></button>
    <button class="case-btn" onclick="convert('title')">Title Case<span class="example">Hello World</span></button>
    <button class="case-btn" onclick="convert('sentence')">Sentence case<span class="example">Hello world</span></button>
    <button class="case-btn" onclick="convert('camel')">camelCase<span class="example">helloWorld</span></button>
    <button class="case-btn" onclick="convert('pascal')">PascalCase<span class="example">HelloWorld</span></button>
    <button class="case-btn" onclick="convert('snake')">snake_case<span class="example">hello_world</span></button>
    <button class="case-btn" onclick="convert('kebab')">kebab-case<span class="example">hello-world</span></button>
    <button class="case-btn" onclick="convert('constant')">CONSTANT_CASE<span class="example">HELLO_WORLD</span></button>
    <button class="case-btn" onclick="convert('alternating')">aLtErNaTiNg<span class="example">hElLo WoRlD</span></button>
    <button class="case-btn" onclick="convert('inverse')">InVeRsE CaSe<span class="example">hELLO wORLD</span></button>

<script>
const inputText = document.getElementById('inputText');
const inputStats = document.getElementById('inputStats');
const resultBox = document.getElementById('resultBox');
const resultLabel = document.getElementById('resultLabel');
const resultText = document.getElementById('resultText');

const labels = {
  upper: 'UPPERCASE', lower: 'lowercase', title: 'Title Case', sentence: 'Sentence case',
  camel: 'camelCase', pascal: 'PascalCase', snake: 'snake_case', kebab: 'kebab-case',
  constant: 'CONSTANT_CASE', alternating: 'aLtErNaTiNg', inverse: 'InVeRsE CaSe', dot: 'dot.case'
};

function getWords(str) {
  return str
    .replace(/([a-z])([A-Z])/g, '$1 $2')
    .replace(/[_\-\.]+/g, ' ')
    .trim()
    .split(/\s+/)
    .filter(w => w.length > 0);
}

function convert(type) {
  const text = inputText.value;
  if (!text.trim()) {
    updateStats();
    return;
  }

  let result = '';
  const words = getWords(text);

  switch(type) {
    case 'upper':
      result = text.toUpperCase();
      break;
    case 'lower':
      result = text.toLowerCase();
      break;
    case 'title':
      result = words.map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');
      break;
    case 'sentence':
      result = text.toLowerCase().replace(/(^\s*\w|[.!?]\s*\w)/g, c => c.toUpperCase());
      break;
    case 'camel':
      result = words.map((w, i) => i === 0 ? w.toLowerCase() : w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join('');
      break;
    case 'pascal':
      result = words.map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join('');
      break;
    case 'snake':
      result = words.map(w => w.toLowerCase()).join('_');
      break;
    case 'kebab':
      result = words.map(w => w.toLowerCase()).join('-');
      break;
    case 'constant':
      result = words.map(w => w.toUpperCase()).join('_');
      break;
    case 'dot':
      result = words.map(w => w.toLowerCase()).join('.');
      break;
    case 'alternating':
      result = text.split('').map((c, i) => i % 2 === 0 ? c.toLowerCase() : c.toUpperCase()).join('');
      break;
    case 'inverse':
      result = text.split('').map(c => c === c.toUpperCase() ? c.toLowerCase() : c.toUpperCase()).join('');
      break;
  }

  resultLabel.textContent = labels[type];
  resultText.textContent = result;
  resultBox.classList.add('show');
  updateStats();
}

function updateStats() {
  const text = inputText.value;
  const chars = text.length;
  const words = text.trim() ? text.trim().split(/\s+/).length : 0;
  inputStats.textContent = `${chars.toLocaleString()} characters · ${words.toLocaleString()} words`;
}

function copyResult() {
  const text = resultText.textContent;
  if (!text) return;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.copy-btn');
    const original = btn.textContent;
    btn.textContent = '✓ Copied!';
    setTimeout(() => { btn.textContent = original; }, 1500);
  });
}

inputText.addEventListener('input', updateStats);
updateStats();
</script>
