<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — 5iles</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      background: #0d0d0d;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #1a1a1a;
      padding: 32px;
      border-radius: 12px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    }
    h1 {
      font-size: 20px;
      margin-bottom: 20px;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 12px;
      border-radius: 6px;
      border: 1px solid #333;
      background: #0d0d0d;
      color: #fff;
      box-sizing: border-box;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      opacity: 0.9;
    }
    #msg {
      margin-top: 12px;
      font-size: 13px;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Set a new password</h1>
    <input type="password" id="newPassword" placeholder="New password" />
    <input type="password" id="confirmPassword" placeholder="Confirm new password" />
    <button onclick="updatePassword()">Update Password</button>
    <div id="msg"></div>
  </div>

  <script>
    const _supabase = supabase.createClient(
      'https://rwmagyyayscaqvjrft.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ3bWFneXlheXNjYXF2anJmdCIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzQ2MDUxMTMxLCJleHAiOjIwNjE2MjcxMzF9.gQclQDMDMVGTFbSY924X7cSfAOUBOBMvRJ-T4VTZQdo'
    );

    let sessionReady = false;

    // Supabase auto-parses the #access_token=... hash on load (detectSessionInUrl
    // defaults to true) and fires this event once the session is actually set.
    _supabase.auth.onAuthStateChange((event, session) => {
      if (session) sessionReady = true;
    });

    window.addEventListener('load', async () => {
      const { data } = await _supabase.auth.getSession();
      if (data.session) sessionReady = true;
    });

    async function updatePassword() {
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const msg = document.getElementById('msg');

      if (newPassword.length < 6) {
        msg.style.color = '#ff4d4d';
        msg.textContent = '✗ Password must be at least 6 characters.';
        return;
      }
      if (newPassword !== confirmPassword) {
        msg.style.color = '#ff4d4d';
        msg.textContent = '✗ Passwords do not match.';
        return;
      }

      if (!sessionReady) {
        // Give it one more chance in case the hash was still being parsed
        const { data } = await _supabase.auth.getSession();
        if (!data.session) {
          msg.style.color = '#ff4d4d';
          msg.textContent = '✗ This reset link has expired or is invalid. Please request a new one.';
          return;
        }
      }

      const { error } = await _supabase.auth.updateUser({ password: newPassword });
      if (error) {
        msg.style.color = '#ff4d4d';
        msg.textContent = '✗ ' + error.message;
      } else {
        msg.style.color = '#4ade80';
        msg.textContent = '✅ Password updated! Redirecting...';
        setTimeout(() => window.location.href = '/', 2000);
      }
    }
  </script>
</body>
</html>
