    </div>

      <select id="addZoneSelect"></select>
      <button class="add-btn" onclick="addZone()">+ Add Zone</button>

</div>

<script>
const TIMEZONES = [
  { id: 'UTC', label: 'UTC' },
  { id: 'America/Los_Angeles', label: 'Los Angeles (PT)' },
  { id: 'America/Denver', label: 'Denver (MT)' },
  { id: 'America/Chicago', label: 'Chicago (CT)' },
  { id: 'America/New_York', label: 'New York (ET)' },
  { id: 'America/Sao_Paulo', label: 'São Paulo' },
  { id: 'Europe/London', label: 'London (GMT/BST)' },
  { id: 'Europe/Paris', label: 'Paris (CET)' },
  { id: 'Europe/Berlin', label: 'Berlin (CET)' },
  { id: 'Europe/Moscow', label: 'Moscow' },
  { id: 'Africa/Cairo', label: 'Cairo' },
  { id: 'Asia/Qatar', label: 'Doha (Qatar)' },
  { id: 'Asia/Dubai', label: 'Dubai (UAE)' },
  { id: 'Asia/Karachi', label: 'Karachi' },
  { id: 'Asia/Kolkata', label: 'Mumbai/Delhi (IST)' },
  { id: 'Asia/Dhaka', label: 'Dhaka' },
  { id: 'Asia/Bangkok', label: 'Bangkok' },
  { id: 'Asia/Singapore', label: 'Singapore' },
  { id: 'Asia/Hong_Kong', label: 'Hong Kong' },
  { id: 'Asia/Shanghai', label: 'Shanghai/Beijing' },
  { id: 'Asia/Tokyo', label: 'Tokyo' },
  { id: 'Asia/Seoul', label: 'Seoul' },
  { id: 'Australia/Sydney', label: 'Sydney' },
  { id: 'Pacific/Auckland', label: 'Auckland' }
];

let activeZones = ['UTC', 'Asia/Qatar', 'Europe/London', 'America/New_York'];

const dateInput = document.getElementById('dateInput');
const timeInput = document.getElementById('timeInput');
const sourceZone = document.getElementById('sourceZone');
const addZoneSelect = document.getElementById('addZoneSelect');
const resultsGrid = document.getElementById('resultsGrid');

function buildZoneOptions(selectEl, selected) {
  selectEl.innerHTML = TIMEZONES.map(tz => `<option value="${tz.id}" ${tz.id === selected ? 'selected' : ''}>${tz.label}</option>`).join('');
}

buildZoneOptions(sourceZone, 'Asia/Qatar');
buildZoneOptions(addZoneSelect, 'America/Los_Angeles');

function setNow() {
  const now = new Date();
  dateInput.value = now.toISOString().split('T')[0];
  timeInput.value = now.toTimeString().slice(0, 5);
  convert();
}

function getZoneLabel(id) {
  const tz = TIMEZONES.find(t => t.id === id);
  return tz ? tz.label : id;
}

function convert() {
  const dateVal = dateInput.value;
  const timeVal = timeInput.value;
  if (!dateVal || !timeVal) return;

  const srcZone = sourceZone.value;

  // Build a date string and interpret it as being in the source timezone
  // We use a trick: format current moment in source TZ to find offset, then construct correctly
  const [year, month, day] = dateVal.split('-').map(Number);
  const [hour, minute] = timeVal.split(':').map(Number);

  // Create a UTC-based date as a baseline
  const naiveDate = new Date(Date.UTC(year, month - 1, day, hour, minute));

  // Find the offset of source timezone at this date
  const offsetMinutes = getTimezoneOffsetMinutes(srcZone, naiveDate);
  const utcDate = new Date(naiveDate.getTime() - offsetMinutes * 60000);

  resultsGrid.innerHTML = activeZones.map(zoneId => {
    const formatted = formatInZone(utcDate, zoneId);
    const isSource = zoneId === srcZone;
    return `
      <div class="zone-result">
        <div>
          <div class="zone-name">${getZoneLabel(zoneId)} ${isSource ? '(source)' : ''}</div>
        </div>
        <div style="display:flex; align-items:center; gap:10px;">
          <div class="zone-time">${formatted}</div>
          ${activeZones.length > 1 ? `<button class="remove-btn" onclick="removeZone('${zoneId}')">✕</button>` : ''}
        </div>
      </div>
    `;
  }).join('');
}

function getTimezoneOffsetMinutes(timeZone, date) {
  const utcDate = new Date(date.toLocaleString('en-US', { timeZone: 'UTC' }));
  const tzDate = new Date(date.toLocaleString('en-US', { timeZone }));
  return (tzDate.getTime() - utcDate.getTime()) / 60000;
}

function formatInZone(utcDate, timeZone) {
  const options = {
    timeZone,
    weekday: 'short',
    month: 'short',
    day: 'numeric',
    hour: '2-digit',
    minute: '2-digit',
    hour12: true
  };
  return new Intl.DateTimeFormat('en-US', options).format(utcDate);
}

function addZone() {
  const zone = addZoneSelect.value;
  if (!activeZones.includes(zone)) {
    activeZones.push(zone);
    convert();
  }
}

function removeZone(zoneId) {
  activeZones = activeZones.filter(z => z !== zoneId);
  convert();
}

dateInput.addEventListener('change', convert);
timeInput.addEventListener('change', convert);
sourceZone.addEventListener('change', convert);

// Initialize with current time
setNow();
</script>
